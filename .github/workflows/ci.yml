name: CI
on: push
jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7     # trae mi código
      - uses: pnpm/action-setup@v6    # instala pnpm
        with:
          version: 11.3.0
      - uses: actions/setup-node@v7   # instala Node
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile      
      - run: pnpm check      
      - run: pnpm astro build     
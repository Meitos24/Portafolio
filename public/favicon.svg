<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- "G" + bloque de cursor, como el nombre del hero. Tinta cobalto (par claro / oscuro). -->
  <style>
    .g { fill: none; stroke: #2f43d2; stroke-width: 4; stroke-linecap: square; }
    .cursor { fill: #2f43d2; }
    @media (prefers-color-scheme: dark) {
      .g { stroke: #9aa8ff; }
      .cursor { fill: #9aa8ff; }
    }
  </style>
  <path class="g" d="M17 10 A8.5 8.5 0 1 0 19.5 16 H13" />
  <rect class="cursor" x="22.5" y="7.5" width="8.5" height="17" />
</svg>
